<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Update Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:#07152d;color:#fff}.card{width:min(520px,96vw);background:#0b2b5d;border:3px solid #d7a62d;border-radius:22px;padding:26px;box-shadow:0 18px 60px #0008}h1{margin:0 0 18px;text-align:center;color:#f6d469}label{display:block;font-weight:800;margin:12px 0 6px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #d7a62d;font-size:16px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#d7a62d;color:#07152d;font-weight:900;font-size:16px}.msg{min-height:25px;margin-top:14px;text-align:center;font-weight:800}.links{text-align:center;margin-top:14px}.links a{color:#fff}
</style>
</head>
<body>
<main class="card">
<h1>Set New Password</h1>
<label>New password</label>
<input id="p1" type="password" minlength="8" autocomplete="new-password" required>
<label>Confirm password</label>
<input id="p2" type="password" minlength="8" autocomplete="new-password" required>
<button id="save">SAVE NEW PASSWORD</button>
<div id="msg" class="msg"></div>
<div class="links"><a href="master-login.html">Back to Master Login</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://chcfhxkggbrlxaopnfum.supabase.co";
const SUPABASE_KEY="sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const msg=document.getElementById('msg');
document.getElementById('save').onclick=async()=>{
  const p1=document.getElementById('p1').value;
  const p2=document.getElementById('p2').value;
  if(p1.length<8){msg.textContent='Password must be at least 8 characters.';return;}
  if(p1!==p2){msg.textContent='Passwords do not match.';return;}
  msg.textContent='Saving...';
  const {error}=await sb.auth.updateUser({password:p1});
  if(error){msg.textContent='Error: '+error.message;return;}
  msg.textContent='Password updated successfully. You may now sign in.';
};
</script>
</body>
</html>
