<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>Master Admin Login V2</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#143f7d,#06152d 50%,#020710);color:#fff;display:grid;place-items:center;padding:24px}.card{width:min(520px,96vw);background:linear-gradient(180deg,#0b2b5d,#061a3b);border:3px solid #d7a62d;border-radius:24px;padding:28px}h1{text-align:center;color:#f6d469}label{display:flex;flex-direction:column;gap:6px;font-weight:800;margin-bottom:14px}input{padding:13px;border-radius:10px;border:1px solid #d7a62d;font-size:16px}button{width:100%;border:0;border-radius:11px;padding:13px;background:#d7a62d;color:#07152d;font-weight:900;font-size:16px}.msg{text-align:center;margin-top:14px;min-height:40px;font-weight:800;white-space:pre-wrap}</style></head>
<body><div class="card"><h1>👑 Master Admin Login V2</h1><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="btn" type="submit">MASTER ADMIN LOGIN</button></form><div id="msg" class="msg"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://chcfhxkggbrlxaopnfum.supabase.co";
const SUPABASE_KEY="sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D";
const MASTER_EMAIL="mano3491@gmail.com";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:"synagogue-master-admin-auth-v3"}});
const form=document.getElementById('loginForm'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
function show(t,ok=false){msg.textContent=t||'';msg.style.color=ok?'#83ff9d':'#ffd56b'}
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='SIGNING IN...';show('Signing in…');try{
 const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;
 if(email!==MASTER_EMAIL)throw new Error('This account is not the master administrator.');
 const {data,error}=await sb.auth.signInWithPassword({email,password}); if(error)throw error; if(!data?.user)throw new Error('No signed-in user returned.');
 if(String(data.user.email||'').toLowerCase()!==MASTER_EMAIL){await sb.auth.signOut({scope:'local'});throw new Error('Authenticated user is not the master administrator.');}
 show('Login successful. Opening Master Admin…',true); location.replace('master-admin-v2.html?v=20260917-2');
}catch(err){console.error(err);show(err.message||String(err));btn.disabled=false;btn.textContent='MASTER ADMIN LOGIN';}});
</script></body></html>
