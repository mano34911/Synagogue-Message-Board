<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Register Your Synagogue</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:radial-gradient(circle at top,#143f7d,#06152d 50%,#020710);
      color:#fff;
      padding:24px
    }
    .wrap{max-width:860px;margin:auto}
    .card{
      background:linear-gradient(180deg,#0b2b5d,#061a3b);
      border:3px solid #d7a62d;
      border-radius:24px;
      box-shadow:0 20px 60px #0008,inset 0 0 0 2px #fff2a633;
      padding:28px
    }
    h1{color:#f6d469;text-align:center;margin:0 0 8px}
    .muted{color:#d8dfef;text-align:center;margin-bottom:26px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .full{grid-column:1/-1}
    label{display:block;color:#f8dfa0;font-weight:700;font-size:18px;margin:0 0 8px}
    input,select{
      width:100%;
      border:2px solid #b9c9e6;
      border-radius:16px;
      padding:16px;
      font-size:18px;
      outline:none;
      background:#fff;
      color:#111
    }
    input:focus,select:focus{border-color:#f2c84b;box-shadow:0 0 0 3px #f2c84b33}
    button,.btn{
      width:100%;
      border:0;
      border-radius:16px;
      padding:17px;
      font-size:20px;
      font-weight:800;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
      display:block
    }
    .primary{
      background:linear-gradient(#ffe27a,#e4ad26);
      color:#10254e;
      margin-top:22px
    }
    .secondary{
      background:#24589b;
      border:2px solid #65a3ec;
      color:#fff;
      margin-top:16px
    }
    .message{
      display:none;
      margin-top:18px;
      padding:16px;
      border-radius:14px;
      text-align:center;
      font-size:18px;
      line-height:1.45
    }
    .error{display:block;background:#6c2430;border:1px solid #d95a70;color:#fff}
    .success{display:block;background:#174f34;border:1px solid #45aa79;color:#fff}
    .info{display:block;background:#203d68;border:1px solid #5a8fd1;color:#fff}
    .footer-note{color:#cbd8eb;text-align:center;margin-top:20px;line-height:1.5}
    @media(max-width:700px){
      body{padding:14px}
      .card{padding:20px}
      .grid{grid-template-columns:1fr}
      .full{grid-column:auto}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Register Your Synagogue</h1>
      <div class="muted">Create your synagogue administrator account.</div>

      <form id="registerForm">
        <div class="grid">

          <div class="full">
            <label for="synagogue_name">Synagogue Name</label>
            <input id="synagogue_name" required>
          </div>

          <div>
            <label for="rabbi_first_name">Rabbi First Name</label>
            <input id="rabbi_first_name" required>
          </div>

          <div>
            <label for="rabbi_last_name">Rabbi Last Name</label>
            <input id="rabbi_last_name" required>
          </div>

          <div class="full">
            <label for="address">Street Address</label>
            <input id="address" required>
          </div>

          <div>
            <label for="city">City</label>
            <input id="city" required>
          </div>

          <div>
            <label for="state">State / Province</label>
            <input id="state" required>
          </div>

          <div>
            <label for="zip_code">ZIP / Postal Code</label>
            <input id="zip_code" required>
          </div>

          <div>
            <label for="country">Country</label>
            <input id="country" value="United States" required>
          </div>

          <div>
            <label for="telephone">Telephone</label>
            <input id="telephone" type="tel" required>
          </div>

          <div>
            <label for="referred_by">Referred By</label>
            <input id="referred_by">
          </div>

          <div class="full">
            <label for="email">Login Email</label>
            <input id="email" type="email" autocomplete="email" required>
          </div>

          <div>
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="new-password" minlength="8" required>
          </div>

          <div>
            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
          </div>
        </div>

        <button id="registerBtn" class="primary" type="submit">Register Synagogue</button>
        <a class="btn secondary" href="./login.html">Back to Login</a>

        <div id="message" class="message"></div>

        <div class="footer-note">
          Your synagogue receives its public synagogue number from the database automatically.
        </div>
      </form>
    </div>
  </div>

  <!-- IMPORTANT: Supabase library FIRST -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- IMPORTANT: this file must be in the SAME GitHub folder as register.html -->
  <script src="./supabase-config.js"></script>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const registerBtn = document.getElementById("registerBtn");

    function showMessage(text, type) {
      message.className = "message " + type;
      message.textContent = text;
    }

    function value(id) {
      return document.getElementById(id).value.trim();
    }

    function makeSlug(name) {
      return name
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 60);
    }

    function getClientOrShowError() {
      if (typeof window.getSupabase !== "function") {
        showMessage(
          "supabase-config.js did not load. Upload supabase-config.js to the same GitHub repository folder as register.html.",
          "error"
        );
        return null;
      }

      try {
        return window.getSupabase();
      } catch (err) {
        showMessage(err.message || "Could not initialize Supabase.", "error");
        return null;
      }
    }

    const sb = getClientOrShowError();

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!sb) {
        showMessage(
          "Supabase is not connected. Make sure supabase-config.js exists beside register.html.",
          "error"
        );
        return;
      }

      const synagogueName = value("synagogue_name");
      const rabbiFirstName = value("rabbi_first_name");
      const rabbiLastName = value("rabbi_last_name");
      const rabbiName = `${rabbiFirstName} ${rabbiLastName}`.trim();
      const address = value("address");
      const city = value("city");
      const state = value("state");
      const zipCode = value("zip_code");
      const country = value("country");
      const telephone = value("telephone");
      const referredBy = value("referred_by");
      const email = value("email").toLowerCase();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage("Password must be at least 8 characters.", "error");
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = "Registering...";
      showMessage("Creating your synagogue account...", "info");

      try {
        const { data: authData, error: authError } = await sb.auth.signUp({
          email,
          password,
          options: {
            data: {
              account_type: "synagogue_owner",
              organization_type: "synagogue",
              synagogue_name: synagogueName,
              rabbi_name: rabbiName,
              telephone
            }
          }
        });

        if (authError) throw authError;
        if (!authData || !authData.user) {
          throw new Error("Supabase did not return a user account.");
        }

        const userId = authData.user.id;
        const slugBase = makeSlug(synagogueName) || "synagogue";
        const slug = `${slugBase}-${userId.slice(0,8)}`;

        const synagoguePayload = {
          owner_user_id: userId,
          name: synagogueName,
          synagogue_name: synagogueName,
          slug,
          rabbi_name: rabbiName,
          rabbi_first_name: rabbiFirstName,
          rabbi_last_name: rabbiLastName,
          address,
          city,
          state,
          zip_code: zipCode,
          country,
          telephone,
          email,
          referred_by: referredBy || null,
          status: "pending"
        };

        let synagogueResult = await sb
          .from("synagogues")
          .insert(synagoguePayload)
          .select("id,synagogue_number")
          .single();

        if (synagogueResult.error) {
          const fallbackPayload = {
            owner_user_id: userId,
            name: synagogueName,
            slug,
            rabbi_name: rabbiName,
            address,
            city,
            state,
            zip_code: zipCode,
            country,
            telephone,
            email,
            referred_by: referredBy || null,
            status: "pending"
          };

          synagogueResult = await sb
            .from("synagogues")
            .insert(fallbackPayload)
            .select("id,synagogue_number")
            .single();
        }

        if (synagogueResult.error) {
          throw synagogueResult.error;
        }

        const synagogueId = synagogueResult.data.id;

        const profilePayload = {
          id: userId,
          user_id: userId,
          email,
          full_name: rabbiName,
          rabbi_name: rabbiName,
          telephone,
          role: "synagogue_admin",
          synagogue_id: synagogueId,
          status: "pending"
        };

        const profileResult = await sb
          .from("profiles")
          .upsert(profilePayload, { onConflict: "id" });

        if (profileResult.error) {
          console.warn("Profile insert warning:", profileResult.error);
        }

        const numberText = synagogueResult.data.synagogue_number
          ? ` Your synagogue number is ${synagogueResult.data.synagogue_number}.`
          : "";

        showMessage(
          "Registration successful." + numberText + " Your account is waiting for master-admin approval. Redirecting to login...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "./login.html";
        }, 3500);

      } catch (err) {
        console.error(err);
        showMessage(
          err && err.message ? err.message : "Registration failed. Please try again.",
          "error"
        );
        registerBtn.disabled = false;
        registerBtn.textContent = "Register Synagogue";
      }
    });
  </script>
</body>
</html>
