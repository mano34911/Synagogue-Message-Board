<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="google" content="notranslate">
  <title>Register Your Synagogue</title>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{
      min-height:100vh;
      padding:24px;
      color:#fff;
      background:
        radial-gradient(circle at top,#173f7b 0,#081c3d 42%,#020711 100%);
    }
    .wrap{width:min(900px,96vw);margin:0 auto}
    .card{
      background:linear-gradient(180deg,#0b2c5e,#061a3a);
      border:3px solid #d4aa42;
      border-radius:24px;
      padding:28px;
      box-shadow:0 22px 60px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,238,169,.15);
    }
    h1{
      margin:0 0 8px;
      text-align:center;
      color:#f4d678;
      font-size:clamp(28px,5vw,40px);
    }
    .sub{
      margin:0 0 22px;
      text-align:center;
      color:#d8e1f0;
      line-height:1.5;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .full{grid-column:1/-1}
    label{
      display:block;
      margin:4px 0 7px;
      font-weight:700;
      color:#f5e7b8;
    }
    input,select{
      width:100%;
      padding:13px 14px;
      border:1px solid #7890b7;
      border-radius:12px;
      background:#fff;
      color:#111;
      font-size:16px;
      outline:none;
    }
    input:focus,select:focus{
      border-color:#f3cd63;
      box-shadow:0 0 0 3px rgba(243,205,99,.18);
    }
    .btn{
      width:100%;
      border:0;
      border-radius:12px;
      padding:14px 16px;
      margin-top:16px;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }
    .primary{
      background:linear-gradient(180deg,#f5d979,#d6a632);
      color:#17213b;
    }
    .secondary{
      background:#174a8d;
      color:#fff;
      border:1px solid #6e9bd2;
    }
    .message{
      display:none;
      margin-top:16px;
      padding:12px 14px;
      border-radius:12px;
      text-align:center;
      line-height:1.45;
    }
    .message.ok{
      display:block;
      background:#123f2d;
      border:1px solid #3d9a6f;
      color:#d9ffec;
    }
    .message.error{
      display:block;
      background:#501f28;
      border:1px solid #b95d70;
      color:#ffe4e9;
    }
    .note{
      margin-top:16px;
      text-align:center;
      color:#bac6d8;
      font-size:13px;
      line-height:1.5;
    }
    @media(max-width:700px){
      .card{padding:22px 18px}
      .grid{grid-template-columns:1fr}
      .full{grid-column:auto}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <main class="card">
      <h1>Register Your Synagogue</h1>
      <p class="sub">
        Create the synagogue owner account. New synagogue accounts remain pending until approved by the Master Admin.
      </p>

      <form id="registerForm" autocomplete="on">
        <div class="grid">
          <div>
            <label for="fullName">Owner Full Name</label>
            <input id="fullName" name="full_name" type="text" autocomplete="name" required>
          </div>

          <div>
            <label for="phone">Telephone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" required>
          </div>

          <div>
            <label for="synagogueName">Synagogue Name</label>
            <input id="synagogueName" name="synagogue_name" type="text" required>
          </div>

          <div>
            <label for="rabbiName">Rabbi Full Name</label>
            <input id="rabbiName" name="rabbi_name" type="text" required>
          </div>

          <div class="full">
            <label for="streetAddress">Street Address</label>
            <input id="streetAddress" name="street_address" type="text" autocomplete="street-address" required>
          </div>

          <div>
            <label for="city">City</label>
            <input id="city" name="city" type="text" autocomplete="address-level2" required>
          </div>

          <div>
            <label for="stateRegion">State / Region</label>
            <input id="stateRegion" name="state_region" type="text" autocomplete="address-level1" required>
          </div>

          <div>
            <label for="postalCode">ZIP / Postal Code</label>
            <input id="postalCode" name="postal_code" type="text" autocomplete="postal-code" required>
          </div>

          <div>
            <label for="country">Country</label>
            <input id="country" name="country" type="text" autocomplete="country-name" value="United States" required>
          </div>

          <div class="full">
            <label for="referredBy">Referred By</label>
            <input id="referredBy" name="referred_by" type="text" placeholder="Optional">
          </div>

          <div class="full">
            <label for="email">Login Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>

          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
          </div>

          <div>
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required>
          </div>
        </div>

        <button id="registerBtn" class="btn primary" type="submit">
          Register Synagogue
        </button>
      </form>

      <button id="loginBtn" class="btn secondary" type="button">
        Back to Login
      </button>

      <div id="message" class="message"></div>

      <div class="note">
        Your synagogue receives its public synagogue number from the database automatically.
      </div>
    </main>
  </div>

  <!-- 1. Load Supabase library first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Load shared configuration second -->
  <script src="supabase-config.js"></script>

  <script>
    (function () {
      "use strict";

      const form = document.getElementById("registerForm");
      const registerBtn = document.getElementById("registerBtn");
      const loginBtn = document.getElementById("loginBtn");
      const messageBox = document.getElementById("message");

      function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = "message " + (type || "error");
      }

      function clearMessage() {
        messageBox.textContent = "";
        messageBox.className = "message";
      }

      function clean(value) {
        return String(value || "").trim();
      }

      function getClient() {
        if (typeof window.getSupabase !== "function") {
          throw new Error(
            "supabase-config.js did not load. Make sure it is uploaded in the same GitHub folder as register.html."
          );
        }

        return window.getSupabase();
      }

      function setBusy(busy) {
        registerBtn.disabled = busy;
        registerBtn.textContent = busy
          ? "Creating Account..."
          : "Register Synagogue";
      }

      loginBtn.addEventListener("click", function () {
        window.location.href = "login.html";
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        clearMessage();

        const fullName = clean(document.getElementById("fullName").value);
        const phone = clean(document.getElementById("phone").value);
        const synagogueName = clean(document.getElementById("synagogueName").value);
        const rabbiName = clean(document.getElementById("rabbiName").value);
        const streetAddress = clean(document.getElementById("streetAddress").value);
        const city = clean(document.getElementById("city").value);
        const stateRegion = clean(document.getElementById("stateRegion").value);
        const postalCode = clean(document.getElementById("postalCode").value);
        const country = clean(document.getElementById("country").value);
        const referredBy = clean(document.getElementById("referredBy").value);
        const email = clean(document.getElementById("email").value).toLowerCase();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (
          !fullName ||
          !phone ||
          !synagogueName ||
          !rabbiName ||
          !streetAddress ||
          !city ||
          !stateRegion ||
          !postalCode ||
          !country ||
          !email ||
          !password
        ) {
          showMessage("Please complete all required fields.", "error");
          return;
        }

        if (password.length < 6) {
          showMessage("Password must be at least 6 characters.", "error");
          return;
        }

        if (password !== confirmPassword) {
          showMessage("The passwords do not match.", "error");
          return;
        }

        setBusy(true);

        try {
          const sb = getClient();

          const { data, error } = await sb.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                role: "synagogue_owner",
                account_status: "pending",
                registration_type: "synagogue",
                full_name: fullName,
                phone: phone,

                organization_name: synagogueName,
                synagogue_name: synagogueName,

                leader_name: rabbiName,
                rabbi_name: rabbiName,

                street_address: streetAddress,
                address_line1: streetAddress,
                city: city,
                state_region: stateRegion,
                postal_code: postalCode,
                country: country,

                referred_by: referredBy
              }
            }
          });

          if (error) {
            throw error;
          }

          if (!data || !data.user) {
            throw new Error("The account was not created. Please try again.");
          }

          showMessage(
            "Registration successful. Your synagogue is pending Master Admin approval.",
            "ok"
          );

          form.reset();
          document.getElementById("country").value = "United States";

          setTimeout(function () {
            window.location.href = "login.html";
          }, 2500);

        } catch (error) {
          console.error("Registration error:", error);

          let text = error && error.message
            ? error.message
            : "Unable to register the synagogue.";

          if (/already registered|already exists|user already/i.test(text)) {
            text = "This email is already registered. Please use Login or Reset Password.";
          }

          showMessage(text, "error");
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
