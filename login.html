<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="google" content="notranslate">
  <title>Synagogue Login</title>

  <style>
    *{box-sizing:border-box}

    :root{
      --navy:#071a38;
      --navy2:#0d2e63;
      --gold:#d8ad46;
      --gold2:#f5da84;
      --cream:#fff8e8;
      --text:#ffffff;
      --muted:#cfd8eb;
      --danger:#ffb4b4;
      --success:#b9f7c7;
    }

    html,body{
      margin:0;
      min-height:100%;
      font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at top,#194f91 0%,#0a244d 36%,#020817 80%);
      color:var(--text);
    }

    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(520px,96vw);
      background:linear-gradient(180deg,rgba(13,46,99,.98),rgba(5,23,53,.98));
      border:3px solid var(--gold);
      border-radius:24px;
      box-shadow:
        0 22px 70px rgba(0,0,0,.5),
        inset 0 0 0 2px rgba(255,245,190,.12);
      padding:28px;
    }

    .logo{
      width:72px;
      height:72px;
      margin:0 auto 14px;
      border:2px solid var(--gold2);
      border-radius:50%;
      display:grid;
      place-items:center;
      font-size:38px;
      background:#061a3b;
      box-shadow:0 0 24px rgba(245,218,132,.18);
    }

    h1{
      margin:0;
      text-align:center;
      color:var(--gold2);
      font-size:30px;
    }

    .subtitle{
      margin:8px 0 24px;
      text-align:center;
      color:var(--muted);
      line-height:1.45;
    }

    label{
      display:block;
      margin:14px 0 7px;
      font-weight:700;
      color:#f8e7ad;
    }

    input{
      width:100%;
      padding:14px 15px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.22);
      background:#071a38;
      color:#fff;
      outline:none;
      font-size:16px;
    }

    input:focus{
      border-color:var(--gold2);
      box-shadow:0 0 0 3px rgba(245,218,132,.12);
    }

    .password-wrap{
      position:relative;
    }

    .password-wrap input{
      padding-right:76px;
    }

    .show-btn{
      position:absolute;
      right:7px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:var(--gold2);
      font-weight:700;
      cursor:pointer;
      padding:8px;
    }

    .btn{
      width:100%;
      border:0;
      border-radius:13px;
      padding:14px 16px;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
      margin-top:15px;
    }

    .btn-primary{
      color:#07152c;
      background:linear-gradient(180deg,#f5da84,#d8ad46);
    }

    .btn-secondary{
      color:#fff;
      background:#13366f;
      border:1px solid rgba(255,255,255,.18);
    }

    .btn-register{
      color:#07152c;
      background:#fff4cd;
      border:1px solid var(--gold);
    }

    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .link-btn{
      display:block;
      width:100%;
      border:0;
      background:transparent;
      color:#f6d469;
      text-decoration:underline;
      cursor:pointer;
      margin-top:15px;
      font-size:15px;
    }

    .message{
      display:none;
      margin-top:17px;
      padding:12px 14px;
      border-radius:11px;
      line-height:1.4;
      word-break:break-word;
    }

    .message.error{
      display:block;
      color:var(--danger);
      background:rgba(130,0,0,.25);
      border:1px solid rgba(255,180,180,.35);
    }

    .message.success{
      display:block;
      color:var(--success);
      background:rgba(0,100,35,.24);
      border:1px solid rgba(185,247,199,.35);
    }

    .small{
      font-size:13px;
      color:var(--muted);
      text-align:center;
      margin-top:18px;
      line-height:1.45;
    }

    .hidden{
      display:none !important;
    }

    .divider{
      height:1px;
      background:rgba(255,255,255,.13);
      margin:20px 0 4px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">✡</div>

    <section id="loginSection">
      <h1>Synagogue Admin Login</h1>
      <p class="subtitle">Sign in to manage your synagogue message board.</p>

      <form id="loginForm" novalidate>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="username"
          placeholder="you@example.com"
          required
        >

        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Your password"
            required
          >
          <button type="button" class="show-btn" id="togglePassword">Show</button>
        </div>

        <button class="btn btn-primary" id="loginBtn" type="submit">
          Sign In
        </button>

        <button class="link-btn" id="forgotBtn" type="button">
          Forgot password?
        </button>

        <div class="divider"></div>

        <button class="btn btn-register" id="registerBtn" type="button">
          Register Your Synagogue
        </button>
      </form>
    </section>

    <section id="recoverySection" class="hidden">
      <h1>Choose New Password</h1>
      <p class="subtitle">Enter your new password below.</p>

      <form id="recoveryForm" novalidate>
        <label for="newPassword">New Password</label>
        <div class="password-wrap">
          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="At least 6 characters"
            required
          >
          <button type="button" class="show-btn" id="toggleNewPassword">Show</button>
        </div>

        <label for="confirmPassword">Confirm New Password</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="Type it again"
          required
        >

        <button class="btn btn-primary" id="savePasswordBtn" type="submit">
          Save New Password
        </button>
      </form>
    </section>

    <div id="message" class="message"></div>

    <p class="small">
      Synagogue Message Board
    </p>
  </main>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your shared Supabase configuration -->
  <script src="supabase-config.js"></script>

  <script>
    (() => {
      "use strict";

      const loginSection = document.getElementById("loginSection");
      const recoverySection = document.getElementById("recoverySection");
      const loginForm = document.getElementById("loginForm");
      const recoveryForm = document.getElementById("recoveryForm");

      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");

      const loginBtn = document.getElementById("loginBtn");
      const forgotBtn = document.getElementById("forgotBtn");
      const registerBtn = document.getElementById("registerBtn");
      const savePasswordBtn = document.getElementById("savePasswordBtn");

      const togglePassword = document.getElementById("togglePassword");
      const toggleNewPassword = document.getElementById("toggleNewPassword");

      const messageBox = document.getElementById("message");

      let supabaseClient = null;

      function showMessage(text, type = "error") {
        messageBox.textContent = text;
        messageBox.className = "message " + type;
      }

      function clearMessage() {
        messageBox.textContent = "";
        messageBox.className = "message";
      }

      function setBusy(button, busy, busyText, normalText) {
        button.disabled = busy;
        button.textContent = busy ? busyText : normalText;
      }

      function showRecoveryMode() {
        clearMessage();
        loginSection.classList.add("hidden");
        recoverySection.classList.remove("hidden");
      }

      function showLoginMode() {
        recoverySection.classList.add("hidden");
        loginSection.classList.remove("hidden");
      }

      function getClient() {
        if (supabaseClient) return supabaseClient;

        if (typeof window.getSupabase === "function") {
          supabaseClient = window.getSupabase();
          return supabaseClient;
        }

        if (
          window.supabase &&
          window.APP_CONFIG &&
          window.APP_CONFIG.SUPABASE_URL &&
          window.APP_CONFIG.SUPABASE_PUBLISHABLE_KEY
        ) {
          supabaseClient = window.supabase.createClient(
            window.APP_CONFIG.SUPABASE_URL,
            window.APP_CONFIG.SUPABASE_PUBLISHABLE_KEY,
            {
              auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
              }
            }
          );
          return supabaseClient;
        }

        throw new Error(
          "Supabase configuration did not load. Make sure supabase-config.js is in the same GitHub folder as login.html."
        );
      }

      function redirectToAdmin() {
        window.location.replace("admin.html");
      }

      togglePassword.addEventListener("click", () => {
        const hidden = passwordInput.type === "password";
        passwordInput.type = hidden ? "text" : "password";
        togglePassword.textContent = hidden ? "Hide" : "Show";
      });

      toggleNewPassword.addEventListener("click", () => {
        const hidden = newPasswordInput.type === "password";
        newPasswordInput.type = hidden ? "text" : "password";
        toggleNewPassword.textContent = hidden ? "Hide" : "Show";
      });

      registerBtn.addEventListener("click", () => {
        window.location.href = "register.html";
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage("Please enter your email and password.");
          return;
        }

        setBusy(loginBtn, true, "Signing In...", "Sign In");

        try {
          const client = getClient();

          const { data, error } = await client.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          if (!data || !data.session) {
            throw new Error("Login succeeded but no session was created.");
          }

          showMessage("Login successful. Opening admin page...", "success");

          setTimeout(() => {
            redirectToAdmin();
          }, 450);

        } catch (error) {
          console.error("Login error:", error);

          let text = error?.message || "Unable to sign in.";

          if (/invalid login credentials/i.test(text)) {
            text = "Incorrect email or password.";
          } else if (/email not confirmed/i.test(text)) {
            text = "Please confirm your email before signing in.";
          }

          showMessage(text);
        } finally {
          setBusy(loginBtn, false, "Signing In...", "Sign In");
        }
      });

      forgotBtn.addEventListener("click", async () => {
        clearMessage();

        const email = emailInput.value.trim();

        if (!email) {
          showMessage("Enter your email address first, then tap Forgot password.");
          emailInput.focus();
          return;
        }

        forgotBtn.disabled = true;
        forgotBtn.textContent = "Sending reset email...";

        try {
          const client = getClient();

          const redirectTo =
            window.location.origin +
            window.location.pathname;

          const { error } = await client.auth.resetPasswordForEmail(email, {
            redirectTo
          });

          if (error) throw error;

          showMessage(
            "Password reset email sent. Open the email and follow the link. You will return here to choose a new password.",
            "success"
          );

        } catch (error) {
          console.error("Password reset error:", error);
          showMessage(error?.message || "Could not send password reset email.");
        } finally {
          forgotBtn.disabled = false;
          forgotBtn.textContent = "Forgot password?";
        }
      });

      recoveryForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();

        const password = newPasswordInput.value;
        const confirm = confirmPasswordInput.value;

        if (password.length < 6) {
          showMessage("Password must be at least 6 characters.");
          return;
        }

        if (password !== confirm) {
          showMessage("The two passwords do not match.");
          return;
        }

        setBusy(
          savePasswordBtn,
          true,
          "Saving...",
          "Save New Password"
        );

        try {
          const client = getClient();

          const { error } = await client.auth.updateUser({
            password
          });

          if (error) throw error;

          showMessage(
            "Password changed successfully. Opening admin page...",
            "success"
          );

          setTimeout(() => {
            redirectToAdmin();
          }, 700);

        } catch (error) {
          console.error("Update password error:", error);
          showMessage(error?.message || "Could not update password.");
        } finally {
          setBusy(
            savePasswordBtn,
            false,
            "Saving...",
            "Save New Password"
          );
        }
      });

      async function initialize() {
        try {
          const client = getClient();

          client.auth.onAuthStateChange((event) => {
            if (event === "PASSWORD_RECOVERY") {
              showRecoveryMode();
            }
          });

          const hash = window.location.hash || "";
          const query = window.location.search || "";

          if (
            hash.includes("type=recovery") ||
            query.includes("type=recovery")
          ) {
            showRecoveryMode();
            return;
          }

          const { data } = await client.auth.getSession();

          if (data?.session) {
            showMessage(
              "You are already signed in. Opening admin page...",
              "success"
            );

            setTimeout(() => {
              redirectToAdmin();
            }, 350);
          } else {
            showLoginMode();
          }

        } catch (error) {
          console.error("Initialization error:", error);
          showMessage(error?.message || "Unable to initialize login.");
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
