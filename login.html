<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Synagogue Login</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,"Noto Sans Hebrew",sans-serif;
      background:radial-gradient(circle at top,#143f7d,#06152d 50%,#020710);
      color:#fff;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(760px,96vw);
      background:linear-gradient(180deg,#0b2b5d,#061a3b);
      border:3px solid #d7a62d;
      border-radius:24px;
      box-shadow:0 20px 60px #0008,inset 0 0 0 2px #fff2a633;
      padding:28px;
    }

    h1{
      color:#f6d469;
      text-align:center;
      margin:0 0 8px;
    }

    .muted{
      color:#d8dfef;
      font-size:14px;
      text-align:center;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
      margin-top:22px;
    }

    label{
      display:flex;
      flex-direction:column;
      gap:6px;
      font-weight:800;
    }

    input{
      width:100%;
      padding:13px;
      border-radius:10px;
      border:1px solid #d7a62d;
      background:#fff;
      color:#111;
      font-size:16px;
    }

    button,.btn{
      display:inline-block;
      border:0;
      border-radius:11px;
      padding:12px 18px;
      background:#d7a62d;
      color:#07152d;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      text-decoration:none;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .secondary{
      background:#fff;
      color:#07152d;
    }

    .success{
      background:#2f9d57;
      color:#fff;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:18px;
    }

    .msg{
      min-height:24px;
      text-align:center;
      margin-top:14px;
      font-weight:800;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Synagogue Message Board</h1>
  <p class="muted">Synagogue Administrator Login</p>

  <form id="loginForm">

    <div class="grid">

      <label>
        Email
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >
      </label>

      <label>
        Password
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

    </div>

    <div class="actions">
      <button id="loginBtn" type="submit">
        Admin Login
      </button>

      <a class="btn secondary" href="register.html">
        Register New Synagogue
      </a>

      <a class="btn success" href="member-login.html">
        Community Member Login
      </a>
    </div>

    <div id="msg" class="msg"></div>

  </form>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey: "AIzaSyAHaMmBGryCf1zRHDpViOmskv0ldFqq6jU",

  authDomain: "synagogueboard.firebaseapp.com",

  projectId: "synagogueboard",

  storageBucket: "synagogueboard.firebasestorage.app",

  messagingSenderId: "99748365924",

  appId: "1:99748365924:android:a2b3faeeee42a46a130171"

};


/* =========================================================
   START FIREBASE
========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   PAGE ELEMENTS
========================================================= */

const loginForm =
  document.getElementById("loginForm");

const loginBtn =
  document.getElementById("loginBtn");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const msg =
  document.getElementById("msg");


function showMessage(text, success=false){

  msg.textContent = text;

  msg.style.color =
    success
      ? "#6cff9d"
      : "#ffd34f";
}


/* =========================================================
   CHECK ADMIN ROLE
========================================================= */

async function getUserProfile(user){

  /*
    Firestore path:

    users/{Firebase UID}

    Example:

    users/
      d8gZO3Hn8pYrddhAh2IIOogu0b83
        role: "admin"
  */

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );

  const userSnapshot =
    await getDoc(userRef);


  if(!userSnapshot.exists()){

    throw new Error(
      "Login successful, but this user does not have a Firestore profile."
    );
  }


  return userSnapshot.data();
}


/* =========================================================
   ADMIN AUTHORIZATION
========================================================= */

async function verifyAdmin(user){

  const profile =
    await getUserProfile(user);

  const role =
    String(
      profile.role || ""
    )
    .trim()
    .toLowerCase();


  if(role !== "admin"){

    throw new Error(
      "This account is not authorized as an administrator."
    );
  }


  return profile;
}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    loginBtn.disabled = true;

    showMessage(
      "Signing in..."
    );


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    try{

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      await verifyAdmin(user);


      showMessage(
        "Admin login successful. Opening admin panel...",
        true
      );


      setTimeout(
        () => {

          window.location.href =
            "admin.html";

        },
        500
      );


    }catch(error){

      console.error(
        "Login error:",
        error
      );


      try{

        await signOut(auth);

      }catch(_){}


      switch(error.code){

        case "auth/invalid-credential":

          showMessage(
            "Incorrect email or password."
          );

          break;


        case "auth/user-not-found":

          showMessage(
            "No Firebase account exists for this email."
          );

          break;


        case "auth/wrong-password":

          showMessage(
            "Incorrect password."
          );

          break;


        case "auth/too-many-requests":

          showMessage(
            "Too many login attempts. Wait a little and try again."
          );

          break;


        default:

          showMessage(
            error.message ||
            "Unable to sign in."
          );
      }


      loginBtn.disabled = false;
    }
  }
);


/* =========================================================
   EXISTING SESSION
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){
      return;
    }


    try{

      await verifyAdmin(user);

      window.location.href =
        "admin.html";


    }catch(error){

      console.log(
        "Existing session is not admin:",
        error
      );

      try{

        await signOut(auth);

      }catch(_){}
    }
  }
);

</script>

</body>
</html>
