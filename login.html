<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Synagogue Message Board - Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#07163c;color:#fff;padding:20px
}
.card{
  width:min(440px,100%);background:#fff8df;color:#1d1d1d;
  border:4px solid #d7a62d;border-radius:24px;padding:28px;
  box-shadow:0 18px 55px #0008
}
h1{margin:0 0 6px;text-align:center;color:#0b1c4b;font-size:28px}
h2{margin:0 0 22px;text-align:center;color:#74520a;font-size:18px}
label{display:block;margin:13px 0 6px;font-weight:700}
input{
  width:100%;padding:14px;border:1px solid #b9b9b9;border-radius:10px;
  font-size:16px;background:#fff
}
button{
  width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;
  font-size:17px;font-weight:700;background:#0b1c4b;color:#fff;cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
#msg{min-height:26px;margin-top:14px;text-align:center;white-space:pre-wrap;font-weight:700}
.note{text-align:center;color:#666;font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Synagogue Message Board</h1>
  <h2>Administrator Login</h2>

  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button id="loginBtn" type="submit">ADMIN LOGIN</button>
  </form>

  <div id="msg"></div>
  <div class="note">Secure login through Supabase Authentication</div>
</div>

<script>
const SUPABASE_URL = "https://chcfhxkggbrlxaopnfum.supabase.co";
const SUPABASE_KEY = "sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false,
    storageKey: "synagogue-message-board-auth"
  }
});

const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("msg");

function show(text, good=false){
  msg.textContent = text || "";
  msg.style.color = good ? "#167a32" : "#b00020";
}

async function loadProfile(userId){
  const { data, error } = await sb
    .from("app_profiles")
    .select("user_id,role,status,synagogue_id,full_name")
    .eq("user_id", userId)
    .maybeSingle();

  if (error) throw new Error("Profile check failed: " + error.message);
  if (!data) throw new Error("Login worked, but no app_profiles record was found for this account.");

  return data;
}

function destinationFor(profile){
  const role = String(profile.role || "").toLowerCase();
  const status = String(profile.status || "").toLowerCase();

  if (status !== "approved") {
    throw new Error("This account is not approved. Current status: " + (status || "unknown"));
  }

  if (role === "master_admin") return "master-admin.html";

  if (role === "synagogue_owner") {
    if (!profile.synagogue_id) {
      throw new Error("The synagogue owner account is missing its synagogue UUID.");
    }
    localStorage.setItem("synagogue_id", profile.synagogue_id);
    return "admin.html";
  }

  throw new Error("This account is not an administrator. Current role: " + (role || "unknown"));
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = "SIGNING IN...";
  show("");

  try {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    // Clear only the local session once, on an intentional login attempt.
    await sb.auth.signOut({ scope: "local" });

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(error.message);
    if (!data?.user) throw new Error("Supabase did not return a signed-in user.");

    const profile = await loadProfile(data.user.id);
    const destination = destinationFor(profile);

    show("Login successful. Opening admin panel...", true);

    // No automatic startup redirect loop; redirect happens only after a successful button login.
    window.location.replace(destination);

  } catch (err) {
    console.error(err);
    show(err?.message || "Admin login failed.");
    btn.disabled = false;
    btn.textContent = "ADMIN LOGIN";
  }
});
</script>
</body>
</html>
