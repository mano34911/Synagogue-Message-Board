<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="google" content="notranslate">
  <title>Synagogue Message Board - Login</title>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      color:#fff;
      background:
        radial-gradient(circle at top,#173f7b 0,#081c3d 42%,#020711 100%);
    }
    .card{
      width:min(560px,96vw);
      background:linear-gradient(180deg,#0b2c5e,#061a3a);
      border:3px solid #d4aa42;
      border-radius:24px;
      padding:28px;
      box-shadow:0 22px 60px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,238,169,.15);
    }
    h1{
      margin:0 0 8px;
      text-align:center;
      color:#f4d678;
      font-size:clamp(28px,5vw,40px);
    }
    .sub{
      margin:0 0 24px;
      text-align:center;
      color:#d8e1f0;
      line-height:1.5;
    }
    label{
      display:block;
      margin:14px 0 7px;
      font-weight:700;
      color:#f5e7b8;
    }
    input{
      width:100%;
      padding:14px 15px;
      border:1px solid #7890b7;
      border-radius:12px;
      background:#fff;
      color:#111;
      font-size:17px;
      outline:none;
    }
    input:focus{
      border-color:#f3cd63;
      box-shadow:0 0 0 3px rgba(243,205,99,.18);
    }
    .btn{
      width:100%;
      border:0;
      border-radius:12px;
      padding:14px 16px;
      margin-top:16px;
      font-size:17px;
      font-weight:800;
      cursor:pointer;
    }
    .primary{
      background:linear-gradient(180deg,#f5d979,#d6a632);
      color:#17213b;
    }
    .secondary{
      background:#174a8d;
      color:#fff;
      border:1px solid #6e9bd2;
    }
    .green{
      background:#167449;
      color:#fff;
      border:1px solid #46a478;
    }
    .outline{
      background:transparent;
      color:#f4d678;
      border:1px solid #d4aa42;
    }
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:4px;
    }
    .message{
      display:none;
      margin-top:16px;
      padding:12px 14px;
      border-radius:12px;
      line-height:1.4;
      text-align:center;
    }
    .message.ok{
      display:block;
      background:#123f2d;
      border:1px solid #3d9a6f;
      color:#d9ffec;
    }
    .message.error{
      display:block;
      background:#501f28;
      border:1px solid #b95d70;
      color:#ffe4e9;
    }
    .small{
      margin-top:18px;
      color:#aebbd1;
      text-align:center;
      font-size:13px;
      line-height:1.5;
    }
    @media(max-width:560px){
      .card{padding:22px 18px}
      .row{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Synagogue Login</h1>
    <p class="sub">Sign in to manage your synagogue message board.</p>

    <form id="loginForm" autocomplete="on">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
        required
      >

      <button id="loginBtn" class="btn primary" type="submit">
        Sign In
      </button>
    </form>

    <button id="resetBtn" class="btn secondary" type="button">
      Forgot / Reset Password
    </button>

    <div class="row">
      <button id="registerSynagogueBtn" class="btn green" type="button">
        Register Synagogue
      </button>

      <button id="registerMemberBtn" class="btn green" type="button">
        Register Member
      </button>
    </div>

    <button id="masterLoginBtn" class="btn outline" type="button">
      Master Admin Login
    </button>

    <div id="message" class="message"></div>

    <div class="small">
      Synagogue Message Board
    </div>
  </main>

  <!-- Supabase library MUST load first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your shared Supabase configuration MUST load second -->
  <script src="supabase-config.js"></script>

  <script>
    (function () {
      "use strict";

      const loginForm = document.getElementById("loginForm");
      const loginBtn = document.getElementById("loginBtn");
      const resetBtn = document.getElementById("resetBtn");
      const registerSynagogueBtn = document.getElementById("registerSynagogueBtn");
      const registerMemberBtn = document.getElementById("registerMemberBtn");
      const masterLoginBtn = document.getElementById("masterLoginBtn");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const messageBox = document.getElementById("message");

      function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = "message " + (type || "error");
      }

      function clearMessage() {
        messageBox.textContent = "";
        messageBox.className = "message";
      }

      function getClient() {
        if (typeof window.getSupabase !== "function") {
          throw new Error(
            "supabase-config.js did not load. Make sure it is in the same GitHub folder as login.html."
          );
        }

        return window.getSupabase();
      }

      async function redirectIfAlreadyLoggedIn() {
        try {
          const supabaseClient = getClient();

          const {
            data: { session },
            error
          } = await supabaseClient.auth.getSession();

          if (error) {
            console.warn("Session check:", error.message);
            return;
          }

          if (session) {
            window.location.replace("admin.html");
          }
        } catch (error) {
          console.error(error);
          showMessage(error.message, "error");
        }
      }

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        clearMessage();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage("Please enter your email and password.", "error");
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing In...";

        try {
          const supabaseClient = getClient();

          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            throw error;
          }

          if (!data || !data.session) {
            throw new Error("Login did not create a session. Please try again.");
          }

          showMessage("Login successful. Opening admin page...", "ok");

          setTimeout(function () {
            window.location.href = "admin.html";
          }, 400);

        } catch (error) {
          console.error("Login error:", error);
          showMessage(error.message || "Unable to sign in.", "error");
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign In";
        }
      });

      resetBtn.addEventListener("click", async function () {
        clearMessage();

        const email = emailInput.value.trim();

        if (!email) {
          showMessage(
            "Enter your email address first, then press Reset Password.",
            "error"
          );
          emailInput.focus();
          return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent = "Sending Reset Email...";

        try {
          const supabaseClient = getClient();

          const redirectTo = new URL("reset-password.html", window.location.href).href;

          const { error } = await supabaseClient.auth.resetPasswordForEmail(
            email,
            { redirectTo }
          );

          if (error) {
            throw error;
          }

          showMessage(
            "Password reset email sent. Check your email.",
            "ok"
          );

        } catch (error) {
          console.error("Password reset error:", error);
          showMessage(error.message || "Unable to send reset email.", "error");
        } finally {
          resetBtn.disabled = false;
          resetBtn.textContent = "Forgot / Reset Password";
        }
      });

      registerSynagogueBtn.addEventListener("click", function () {
        window.location.href = "register.html";
      });

      registerMemberBtn.addEventListener("click", function () {
        window.location.href = "member-register.html";
      });

      masterLoginBtn.addEventListener("click", function () {
        window.location.href = "master-login.html";
      });

      window.addEventListener("load", redirectIfAlreadyLoggedIn);
    })();
  </script>
</body>
</html>
