<!doctype html>
<html lang="he" dir="rtl" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta http-equiv="Content-Language" content="he">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b43">
  <title>כניסה לניהול בית הכנסת</title>

  <style>
    :root{
      --navy:#101b43;
      --navy2:#17285e;
      --gold:#c79b43;
      --gold2:#f0d48a;
      --cream:#fff8df;
      --line:#d2b15d;
      --ink:#241d11;
      --green:#0f7d49;
      --red:#a12a2a;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:Arial,"Noto Sans Hebrew",sans-serif;
      background:
        radial-gradient(circle at top,#263560 0,#10182f 38%,#070a12 80%);
      color:var(--ink);
    }

    body{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:16px;
    }

    .card{
      width:min(520px,100%);
      background:linear-gradient(180deg,#fffdf6,#fff4d4);
      border:4px solid var(--gold);
      border-radius:26px;
      box-shadow:
        0 0 0 3px #fff0a4,
        0 20px 60px #0009;
      overflow:hidden;
    }

    .head{
      background:linear-gradient(180deg,var(--navy2),var(--navy));
      color:#fff;
      text-align:center;
      padding:22px 18px;
      border-bottom:4px solid var(--gold);
    }

    .head h1{
      margin:0;
      color:#fff3bd;
      font-size:clamp(28px,5vw,40px);
    }

    .head p{
      margin:7px 0 0;
      color:#ead58c;
      font-weight:700;
    }

    .body{
      padding:22px;
    }

    label{
      display:block;
      font-weight:800;
      margin:12px 0 6px;
      color:#24315d;
    }

    input{
      width:100%;
      border:2px solid var(--line);
      border-radius:12px;
      padding:12px 13px;
      font-size:17px;
      background:#fff;
      outline:none;
      direction:ltr;
      text-align:left;
    }

    input:focus{
      border-color:#224b9a;
      box-shadow:0 0 0 3px #224b9a22;
    }

    .password-wrap{
      position:relative;
    }

    .toggle{
      position:absolute;
      left:8px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:#f3e2aa;
      color:#17285e;
      border-radius:9px;
      padding:7px 9px;
      cursor:pointer;
      font-weight:800;
    }

    .status{
      margin-top:14px;
      border:2px solid var(--line);
      background:#fffdf4;
      border-radius:12px;
      padding:10px 12px;
      font-weight:800;
      color:#283661;
      min-height:45px;
      display:flex;
      align-items:center;
    }

    .actions{
      display:grid;
      gap:10px;
      margin-top:16px;
    }

    button.main,
    a.linkbtn{
      width:100%;
      border:0;
      border-radius:13px;
      padding:12px 14px;
      font-size:17px;
      font-weight:900;
      cursor:pointer;
      text-decoration:none;
      text-align:center;
      display:block;
    }

    button.main{
      background:var(--green);
      color:#fff;
    }

    button.main:disabled{
      opacity:.6;
      cursor:wait;
    }

    a.linkbtn{
      background:#132451;
      color:#fff;
      border:2px solid #d5b35d;
    }

    .small{
      text-align:center;
      margin-top:14px;
      color:#665b3d;
      font-size:14px;
      line-height:1.5;
    }

    .small a{
      color:#173d8a;
      font-weight:800;
      text-decoration:none;
    }
  </style>
</head>

<body>
  <main class="card">
    <header class="head">
      <h1>כניסה לניהול</h1>
      <p>לוח בית הכנסת</p>
    </header>

    <section class="body">
      <form id="loginForm">
        <label for="email">אימייל</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="name@example.com"
          required
        >

        <label for="password">סיסמה</label>
        <div class="password-wrap">
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            required
          >
          <button class="toggle" id="togglePassword" type="button">הצג</button>
        </div>

        <div class="status" id="status">הזן אימייל וסיסמה</div>

        <div class="actions">
          <button class="main" id="loginBtn" type="submit">כניסה</button>
          <a class="linkbtn" href="register.html">הרשמה לבית הכנסת</a>
          <a class="linkbtn" href="index.html">חזרה ללוח</a>
        </div>
      </form>

      <div class="small">
        אם החשבון טרם אושר, ההרשמה תישאר ממתינה עד לאישור מנהל המערכת.
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://chcfhxkggbrlxaopnfum.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rwCYiLLLcYCOm7X9JXxAtQ_9ailfQ6D";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("loginForm");
    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const statusEl = document.getElementById("status");
    const loginBtn = document.getElementById("loginBtn");
    const togglePassword = document.getElementById("togglePassword");

    function setStatus(text, type="normal"){
      statusEl.textContent = text;

      if(type === "ok"){
        statusEl.style.background = "#e8fff2";
        statusEl.style.borderColor = "#57a67c";
        statusEl.style.color = "#155936";
      }else if(type === "bad"){
        statusEl.style.background = "#fff0f0";
        statusEl.style.borderColor = "#c56b6b";
        statusEl.style.color = "#7d2020";
      }else{
        statusEl.style.background = "#fffdf4";
        statusEl.style.borderColor = "#d2b15d";
        statusEl.style.color = "#283661";
      }
    }

    togglePassword.addEventListener("click",()=>{
      const showing = passwordEl.type === "text";
      passwordEl.type = showing ? "password" : "text";
      togglePassword.textContent = showing ? "הצג" : "הסתר";
    });

    async function checkExistingSession(){
      try{
        const { data } = await sb.auth.getSession();

        if(data.session){
          location.href = "admin.html";
        }
      }catch(e){
        console.warn(e);
      }
    }

    form.addEventListener("submit", async (event)=>{
      event.preventDefault();

      const email = emailEl.value.trim();
      const password = passwordEl.value;

      if(!email || !password){
        setStatus("נא למלא אימייל וסיסמה", "bad");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "מתחבר...";
      setStatus("מתחבר למערכת...");

      try{
        const { data, error } = await sb.auth.signInWithPassword({
          email,
          password
        });

        if(error) throw error;

        if(!data.session){
          throw new Error("לא נוצרה התחברות פעילה");
        }

        setStatus("התחברת בהצלחה", "ok");

        setTimeout(()=>{
          location.href = "admin.html";
        }, 350);

      }catch(err){
        console.error(err);

        let msg = err?.message || "שגיאה בהתחברות";

        if(msg.toLowerCase().includes("invalid login credentials")){
          msg = "האימייל או הסיסמה אינם נכונים";
        }else if(msg.toLowerCase().includes("email not confirmed")){
          msg = "האימייל עדיין לא אושר";
        }

        setStatus(msg, "bad");
      }finally{
        loginBtn.disabled = false;
        loginBtn.textContent = "כניסה";
      }
    });

    checkExistingSession();
  </script>
</body>
</html>
