<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Master Admin — Synagogue Message Board</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    *{box-sizing:border-box}
    :root{
      --navy:#071c3f;
      --navy2:#0b2d63;
      --gold:#e0aa22;
      --cream:#f8e7a7;
      --green:#25a85a;
      --red:#c82127;
      --white:#fff;
      --ink:#07162f;
      --line:#d7dce5;
    }
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#030a14;color:#fff}
    body{padding:20px}
    .shell{
      width:min(1550px,98vw);
      margin:0 auto;
      background:linear-gradient(180deg,var(--navy2),var(--navy));
      border:4px solid var(--gold);
      border-radius:34px;
      padding:24px;
      box-shadow:0 18px 55px #0009;
    }
    h1{margin:0;color:#f7d76b;text-align:center;font-size:clamp(28px,4vw,52px)}
    .subtitle{text-align:center;color:#dce7fb;margin:8px 0 20px;font-size:18px}
    .toolbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    button,a.btn{
      border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:16px;cursor:pointer;
      text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
    }
    .gold{background:var(--gold);color:#06204b}
    .white{background:#fff;color:#06204b}
    .green{background:var(--green);color:#fff}
    .red{background:var(--red);color:#fff}
    .blue{background:#1c67d2;color:#fff}
    .gray{background:#687386;color:#fff}
    .status{
      padding:12px 14px;border-radius:14px;background:#ffffff12;border:1px solid #ffffff26;
      margin:12px 0 18px;text-align:center;font-weight:700
    }
    .error{background:#6b1018;color:#fff}
    .success{background:#0c5730;color:#fff}
    .table-wrap{overflow:auto;border-radius:20px;border:1px solid #ffffff22;background:#fff}
    table{width:100%;border-collapse:collapse;min-width:1450px;color:#111}
    thead th{
      background:var(--cream);padding:15px 10px;text-align:left;font-size:17px;position:sticky;top:0;z-index:1
    }
    tbody td{padding:14px 10px;border-top:1px solid var(--line);vertical-align:top;background:#fff}
    tbody tr:nth-child(even) td{background:#fbfcfe}
    .name{font-weight:900;font-size:18px}
    .small{font-size:13px;color:#58606c;line-height:1.35}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:800;background:#e9edf3}
    .pill.active,.pill.approved{background:#d8f3e3;color:#176633}
    .pill.pending{background:#fff0c9;color:#845d00}
    .pill.suspended{background:#ffd9da;color:#8f141a}
    input{
      width:120px;padding:10px;border:1px solid #aab1bc;border-radius:10px;font-size:16px
    }
    .actions{display:flex;gap:8px;flex-wrap:wrap;min-width:380px}
    .actions button{padding:10px 13px;font-size:14px}
    .info-grid{display:grid;grid-template-columns:1fr;gap:3px}
    .label{font-weight:800;color:#1f2d43}
    .muted{color:#697386}
    .empty{padding:30px;text-align:center;color:#2e394a;font-weight:700}
    @media(max-width:700px){
      body{padding:8px}
      .shell{padding:14px;border-radius:22px}
      h1{font-size:30px}
    }
  </style>
</head>

<body>
  <main class="shell">
    <h1>Master Admin</h1>
    <div class="subtitle">Synagogue accounts, rabbi information, billing and account controls</div>

    <div class="toolbar">
      <button class="gold" id="refreshBtn">Refresh</button>
      <a class="btn blue" href="register.html">Register Synagogue</a>
      <button class="white" id="logoutBtn">Logout</button>
    </div>

    <div id="statusBox" class="status">Checking master admin session…</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th># / ID</th>
            <th>Synagogue</th>
            <th>Rabbi / Owner</th>
            <th>Address</th>
            <th>Telephone</th>
            <th>Email / Login</th>
            <th>Status</th>
            <th>Trial</th>
            <th>Price / month</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="10" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

<script>
(() => {
  "use strict";

  const sb = window.getSupabase ? window.getSupabase() : null;
  const rowsEl = document.getElementById("rows");
  const statusBox = document.getElementById("statusBox");
  const refreshBtn = document.getElementById("refreshBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  if (!sb) {
    setStatus("Supabase client could not be created. Check supabase-config.js.", true);
    return;
  }

  function esc(v){
    return String(v ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function setStatus(msg, isError=false, isSuccess=false){
    statusBox.textContent = msg;
    statusBox.className = "status" + (isError ? " error" : isSuccess ? " success" : "");
  }

  function first(obj, keys, fallback=""){
    for (const k of keys){
      if (obj && obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== ""){
        return obj[k];
      }
    }
    return fallback;
  }

  function hasAny(obj, keys){
    return keys.find(k => Object.prototype.hasOwnProperty.call(obj, k)) || null;
  }

  function fmtDate(v){
    if (!v) return "—";
    const d = new Date(v);
    if (Number.isNaN(d.getTime())) return esc(v);
    return d.toLocaleDateString();
  }

  function statusClass(status){
    const s = String(status || "").toLowerCase();
    if (s.includes("suspend")) return "suspended";
    if (s.includes("pend")) return "pending";
    if (s.includes("active") || s.includes("approve")) return "active";
    return "";
  }

  async function requireMaster(){
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;

    if (!session) {
      location.href = "login.html";
      return null;
    }

    // If your database has a master_admins table, this verifies it.
    // If not, the page still loads for an authenticated user and relies on RLS.
    try {
      const { data, error: masterErr } = await sb
        .from("master_admins")
        .select("*")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (!masterErr && !data) {
        setStatus("This account is not listed as a master admin.", true);
        return null;
      }
    } catch (_) {}

    return session;
  }

  async function loadSynagogues(){
    setStatus("Loading synagogue accounts…");
    rowsEl.innerHTML = '<tr><td colspan="10" class="empty">Loading…</td></tr>';

    try {
      const session = await requireMaster();
      if (!session) return;

      const { data, error } = await sb
        .from("synagogues")
        .select("*")
        .order("created_at", { ascending: true });

      if (error) throw error;

      const list = data || [];
      setStatus(`Master admin login successful — ${list.length} synagogue account(s).`, false, true);

      if (!list.length){
        rowsEl.innerHTML = '<tr><td colspan="10" class="empty">No synagogue accounts found.</td></tr>';
        return;
      }

      rowsEl.innerHTML = list.map(renderRow).join("");
      attachActions(list);
    } catch (err) {
      console.error(err);
      setStatus("Error: " + (err.message || err), true);
      rowsEl.innerHTML = `<tr><td colspan="10" class="empty">Unable to load synagogue accounts.<br>${esc(err.message || err)}</td></tr>`;
    }
  }

  function renderRow(s){
    const number = first(s, ["synagogue_number","member_number","account_number"], "");
    const id = first(s, ["id"], "");

    const synagogueName = first(s, ["synagogue_name","name","organization_name"], "Unnamed Synagogue");
    const rabbiName = first(s, ["rabbi_full_name","rabbi_name","owner_name","full_name","contact_name"], "—");
    const address = first(s, ["address","street_address","synagogue_address"], "—");
    const city = first(s, ["city"], "");
    const state = first(s, ["state","province"], "");
    const zip = first(s, ["zip","zip_code","postal_code"], "");
    const phone = first(s, ["telephone","phone","phone_number","mobile"], "—");
    const email = first(s, ["email","owner_email","admin_email","login_email"], "—");
    const status = first(s, ["status","account_status"], "active");
    const trialEnd = first(s, ["trial_end","trial_ends_at","trial_end_date"], "");
    const price = first(s, ["monthly_price","price_per_month","price","subscription_price"], 0);

    const address2 = [city,state,zip].filter(Boolean).join(", ");

    return `
      <tr data-id="${esc(id)}">
        <td>
          <div class="name">${number ? "#" + esc(number) : "—"}</div>
          <div class="small">${esc(id)}</div>
        </td>

        <td>
          <div class="name">${esc(synagogueName)}</div>
          <div class="small">Created: ${fmtDate(first(s,["created_at"],""))}</div>
        </td>

        <td>
          <div class="info-grid">
            <span class="label">${esc(rabbiName)}</span>
          </div>
        </td>

        <td>
          <div>${esc(address)}</div>
          ${address2 ? `<div class="small">${esc(address2)}</div>` : ""}
        </td>

        <td>${esc(phone)}</td>

        <td>
          <div>${esc(email)}</div>
          <div class="small">Login email</div>
        </td>

        <td>
          <span class="pill ${statusClass(status)}">${esc(status)}</span>
        </td>

        <td>${trialEnd ? fmtDate(trialEnd) : "—"}</td>

        <td>
          <input class="priceInput" type="number" min="0" step="0.01" value="${esc(price)}">
        </td>

        <td>
          <div class="actions">
            <button class="green approveBtn">Approve + 7 Days</button>
            <button class="gold activateBtn">Activate</button>
            <button class="red suspendBtn">Suspend</button>
            <button class="blue savePriceBtn">Save Price</button>
            ${email !== "—" ? '<button class="gray resetBtn">Send Password Reset</button>' : ""}
          </div>
        </td>
      </tr>
    `;
  }

  function attachActions(list){
    document.querySelectorAll("tbody tr[data-id]").forEach(tr => {
      const id = tr.dataset.id;
      const row = list.find(x => String(x.id) === String(id));
      if (!row) return;

      tr.querySelector(".approveBtn")?.addEventListener("click", () => approve7(row));
      tr.querySelector(".activateBtn")?.addEventListener("click", () => setAccountStatus(row, "active"));
      tr.querySelector(".suspendBtn")?.addEventListener("click", () => setAccountStatus(row, "suspended"));
      tr.querySelector(".savePriceBtn")?.addEventListener("click", () => savePrice(row, tr));
      tr.querySelector(".resetBtn")?.addEventListener("click", () => sendPasswordReset(row));
    });
  }

  async function updateRow(id, payload){
    const { error } = await sb.from("synagogues").update(payload).eq("id", id);
    if (error) throw error;
  }

  async function approve7(row){
    try{
      const payload = {};

      const statusCol = hasAny(row, ["status","account_status"]);
      if (statusCol) payload[statusCol] = "active";

      const trialCol = hasAny(row, ["trial_end","trial_ends_at","trial_end_date"]);
      if (trialCol){
        const d = new Date();
        d.setDate(d.getDate() + 7);
        payload[trialCol] = d.toISOString();
      }

      if (!Object.keys(payload).length){
        throw new Error("No status or trial column was found in the synagogues table.");
      }

      await updateRow(row.id, payload);
      setStatus("Synagogue approved and 7-day trial applied.", false, true);
      await loadSynagogues();
    }catch(err){
      setStatus("Approve failed: " + (err.message || err), true);
    }
  }

  async function setAccountStatus(row, newStatus){
    try{
      const statusCol = hasAny(row, ["status","account_status"]);
      if (!statusCol) throw new Error("No status column was found in the synagogues table.");

      await updateRow(row.id, { [statusCol]: newStatus });
      setStatus(`Account changed to ${newStatus}.`, false, true);
      await loadSynagogues();
    }catch(err){
      setStatus("Status update failed: " + (err.message || err), true);
    }
  }

  async function savePrice(row, tr){
    try{
      const input = tr.querySelector(".priceInput");
      const price = Number(input.value || 0);

      const priceCol = hasAny(row, ["monthly_price","price_per_month","price","subscription_price"]);
      if (!priceCol) throw new Error("No monthly price column was found in the synagogues table.");

      await updateRow(row.id, { [priceCol]: price });
      setStatus("Monthly price saved.", false, true);
      await loadSynagogues();
    }catch(err){
      setStatus("Price update failed: " + (err.message || err), true);
    }
  }

  async function sendPasswordReset(row){
    try{
      const email = first(row, ["email","owner_email","admin_email","login_email"], "");
      if (!email) throw new Error("No email address is stored for this synagogue.");

      const redirectTo = new URL("login.html", window.location.href).href;

      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;

      setStatus(`Password reset email sent to ${email}.`, false, true);
    }catch(err){
      setStatus("Password reset failed: " + (err.message || err), true);
    }
  }

  refreshBtn.addEventListener("click", loadSynagogues);

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
    location.href = "login.html";
  });

  loadSynagogues();
})();
</script>
</body>
</html>
